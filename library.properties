name=UngulaOta
version=1.1.0
author=Alex Conesa <alexconesap@gmail.com>
maintainer=Alex Conesa <alexconesap@gmail.com>
sentence=High-performance embedded C++ libraries for ESP32, STM32 and other MCUs: streaming OTA firmware update (HTTP or SD source).
paragraph=Embedded C++17 OTA updater. Pluggable IOtaSource (HTTP via UngulaNet or SD card) and IFirmwareWriter for the ESP32 partition. Streams chunks without buffering the full image. Also provides OtaCoordinator (ESP32 only): a multi-node update FSM (notify peers -> wait -> update MAIN -> reboot) with the project peer-protocol abstracted behind CoordinatorHost and no UI/i18n dependency. Compile-time source selection via ENABLE_OTA_HTTP / ENABLE_OTA_SD. Requires 16 KB loop task stack on Arduino. Supported targets: ESP32 only — uses the ESP32 partition writer (esp_ota_*); STM32 and other MCUs are not supported.
category=Communication
url=https://github.com/alexconesap/ungula-ota.git
includes=ungula_ota.h
depends=UngulaCore,EmblogX,UngulaNet
architectures=esp32

